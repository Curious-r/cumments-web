name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 0.1.7). Leave empty to use current ref.'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Verify artifact
        run: |
          test -f dist/cumments-web.js || (echo "missing dist/cumments-web.js" && exit 1)
          ls dist/assets/pow.worker-*.js > /dev/null || (echo "missing pow.worker" && exit 1)
          echo "artifact verified"
          ls -lh dist/
          sha256sum dist/cumments-web.js | tee dist/cumments-web.js.sha256
          cat dist/cumments-web.js.sha256
      - name: Generate provenance
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          fi
          # For workflow_dispatch without version, fallback to package.json version
          if [ "$VERSION" = "${GITHUB_REF#refs/heads/}" ] || [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' package.json | head -1 | cut -d'"' -f4)
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Provenance for $TAG ($VERSION)"
          COMMIT=$(git rev-parse HEAD)
          API_CONTRACT=$(grep -E "^commit:" api/openapi.provenance | awk '{print $2}' || echo "unknown")
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > dist/provenance.json <<PROV_EOF
          {
            "name": "cumments-web",
            "version": "$VERSION",
            "tag": "$TAG",
            "commit": "$COMMIT",
            "api_contract": "$API_CONTRACT",
            "built_at": "$BUILT_AT"
          }
          PROV_EOF
          cat dist/provenance.json
      - name: Prepare Pages artifact
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          elif [ -n "$VERSION" ]; then
            TAG="v$VERSION"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            if [ "$VERSION" = "${GITHUB_REF#refs/heads/}" ] || [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
              VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' package.json | head -1 | cut -d'"' -f4)
              TAG="v$VERSION"
            fi
          fi
          echo "Preparing site for $TAG ($VERSION)"

          LIVE_LATEST_VERSION=""
          if curl -sf https://cumments-web.curious.host/latest/provenance.json -o /tmp/live_latest_provenance.json 2>/dev/null; then
            LIVE_LATEST_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/live_latest_provenance.json | head -1 | cut -d'"' -f4 || true)
            echo "Live latest version: ${LIVE_LATEST_VERSION:-<none>}"
          else
            echo "No live latest found (first deploy or network issue)"
          fi

          SHOULD_UPDATE_LATEST="false"
          if [ -z "$LIVE_LATEST_VERSION" ]; then
            SHOULD_UPDATE_LATEST="true"
            echo "No live latest, will create latest as $VERSION"
          elif [ "$VERSION" = "$LIVE_LATEST_VERSION" ]; then
            SHOULD_UPDATE_LATEST="true"
            echo "Re-deploying current latest $VERSION, will update latest"
          else
            HIGHEST=$(printf '%s\n%s\n' "$LIVE_LATEST_VERSION" "$VERSION" | sort -V | tail -n1)
            if [ "$HIGHEST" = "$VERSION" ]; then
              SHOULD_UPDATE_LATEST="true"
              echo "Will update latest: $VERSION > $LIVE_LATEST_VERSION"
            else
              SHOULD_UPDATE_LATEST="false"
              echo "Will preserve latest: $VERSION < $LIVE_LATEST_VERSION (latest stays $LIVE_LATEST_VERSION)"
            fi
          fi

          rm -rf site
          mkdir -p site

          echo "Preserving existing versioned artifacts from live site..."
          for tag in $(git tag --list 'v*' | sort -V); do
            ver=${tag#v}
            if [ "$ver" = "$VERSION" ]; then
              continue
            fi
            if [ "$ver" = "latest" ]; then
              continue
            fi
            if curl -sf -o /tmp/prev_provenance.json "https://cumments-web.curious.host/$ver/provenance.json" 2>/dev/null; then
              echo "Preserving $ver from live site"
              mkdir -p "site/$ver"
              mkdir -p "site/$ver/assets"
              curl -sf "https://cumments-web.curious.host/$ver/cumments-web.js" -o "site/$ver/cumments-web.js" 2>/dev/null || true
              curl -sf "https://cumments-web.curious.host/$ver/cumments-web.js.map" -o "site/$ver/cumments-web.js.map" 2>/dev/null || true
              curl -sf "https://cumments-web.curious.host/$ver/cumments-web.js.sha256" -o "site/$ver/cumments-web.js.sha256" 2>/dev/null || true
              curl -sf "https://cumments-web.curious.host/$ver/provenance.json" -o "site/$ver/provenance.json" 2>/dev/null || true
              worker_js=$(grep -o 'pow\.worker[^"]*\.js' "site/$ver/cumments-web.js" 2>/dev/null | head -1 || true)
              if [ -z "$worker_js" ]; then
                worker_js=$(curl -sf "https://cumments-web.curious.host/$ver/cumments-web.js" 2>/dev/null | grep -o 'pow\.worker[^"]*\.js' | head -1 || true)
              fi
              if [ -n "$worker_js" ]; then
                curl -sf "https://cumments-web.curious.host/$ver/assets/$worker_js" -o "site/$ver/assets/$worker_js" 2>/dev/null || true
                curl -sf "https://cumments-web.curious.host/$ver/assets/$worker_js.map" -o "site/$ver/assets/$worker_js.map" 2>/dev/null || true
              fi
            else
              echo "Version $ver not found on live site, skipping"
            fi
          done

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "Fetching gh-pages branch as fallback..."
            git fetch origin gh-pages --depth=1 2>/dev/null || true
            if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
              git worktree add /tmp/gh-pages-legacy origin/gh-pages 2>/dev/null || (git fetch origin gh-pages 2>/dev/null && git worktree add /tmp/gh-pages-legacy origin/gh-pages 2>/dev/null) || true
              if [ -d /tmp/gh-pages-legacy ]; then
                for d in /tmp/gh-pages-legacy/0.* ; do
                  if [ -d "$d" ]; then
                    base=$(basename "$d")
                    if [ "$base" != "$VERSION" ] && [ ! -d "site/$base" ]; then
                      echo "Fallback preserving $base from gh-pages branch"
                      cp -r "$d" site/ || true
                    fi
                  fi
                done
                git worktree remove /tmp/gh-pages-legacy --force 2>/dev/null || true
              fi
            fi
          fi

          mkdir -p "site/$VERSION"
          cp -r dist/* "site/$VERSION/"
          echo "Added $VERSION"

          if [ "$SHOULD_UPDATE_LATEST" = "true" ]; then
            echo "Updating latest -> $VERSION"
            rm -rf site/latest
            mkdir -p site/latest
            cp -r dist/* site/latest/
          else
            echo "Preserving existing latest ($LIVE_LATEST_VERSION), not overwriting with $VERSION"
            if [ ! -d site/latest ]; then
              echo "Restoring live latest $LIVE_LATEST_VERSION into site/latest"
              mkdir -p site/latest
              mkdir -p site/latest/assets
              curl -sf https://cumments-web.curious.host/latest/provenance.json -o site/latest/provenance.json 2>/dev/null || true
              curl -sf https://cumments-web.curious.host/latest/cumments-web.js -o site/latest/cumments-web.js 2>/dev/null || true
              curl -sf https://cumments-web.curious.host/latest/cumments-web.js.map -o site/latest/cumments-web.js.map 2>/dev/null || true
              curl -sf https://cumments-web.curious.host/latest/cumments-web.js.sha256 -o site/latest/cumments-web.js.sha256 2>/dev/null || true
              worker=$(grep -o 'pow\.worker[^"]*\.js' site/latest/cumments-web.js 2>/dev/null | head -1 || true)
              if [ -z "$worker" ]; then
                worker=$(curl -sf https://cumments-web.curious.host/latest/cumments-web.js 2>/dev/null | grep -o 'pow\.worker[^"]*\.js' | head -1 || true)
              fi
              if [ -n "$worker" ]; then
                curl -sf "https://cumments-web.curious.host/latest/assets/$worker" -o "site/latest/assets/$worker" 2>/dev/null || true
                curl -sf "https://cumments-web.curious.host/latest/assets/$worker.map" -o "site/latest/assets/$worker.map" 2>/dev/null || true
              fi
            fi
            if [ ! -f site/latest/provenance.json ]; then
              echo "WARNING: site/latest provenance missing after preservation attempt"
              ls -R site/latest 2>/dev/null || echo "site/latest empty"
            fi
          fi

          {
            echo '<html><body><h1>cumments-web CDN</h1><ul>'
            for verdir in site/0.*; do
              if [ -d "$verdir" ]; then
                vbase=$(basename "$verdir")
                echo "<li><a href=\"$vbase/cumments-web.js\">$vbase</a> (<a href=\"$vbase/provenance.json\">provenance</a>)</li>"
              fi
            done
            echo '<li><a href="latest/cumments-web.js">latest</a> (<a href="latest/provenance.json">provenance</a>)</li>'
            echo '</ul>'
            if [ -f site/latest/provenance.json ]; then
              latest_ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' site/latest/provenance.json | head -1 | cut -d'"' -f4 || echo "unknown")
              echo "<p>latest points to $latest_ver</p>"
            fi
            echo '</body></html>'
          } > site/index.html

          echo "Final site content:"
          find site -type f | sort | head -n 100
          for verdir in site/0.*; do
            if [ -d "$verdir" ]; then
              echo "--- $verdir provenance ---"
              cat "$verdir/provenance.json" 2>/dev/null | head -20 || echo "no provenance"
            fi
          done
          echo "--- latest provenance ---"
          cat site/latest/provenance.json 2>/dev/null | head -20 || echo "no latest provenance"
          if ! ls site/$VERSION/assets/pow.worker-*.js >/dev/null 2>&1; then
            echo "checking worker in $VERSION"
            ls -R "site/$VERSION/assets" 2>/dev/null || echo "no assets"
            ls site/$VERSION/assets/pow.worker-*.js 2>/dev/null || (echo "missing pow.worker in $VERSION" && exit 1)
          fi
          if ! ls site/latest/assets/pow.worker-*.js >/dev/null 2>&1; then
            echo "checking worker in latest"
            ls -R site/latest/assets 2>/dev/null || echo "no latest assets"
            ls site/latest/assets/pow.worker-*.js 2>/dev/null || (echo "missing pow.worker in latest" && exit 1)
          fi
          echo "Worker co-location verified"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
