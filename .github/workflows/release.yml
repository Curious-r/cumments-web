name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Verify artifact
        run: |
          test -f dist/cumments-web.js || (echo "missing dist/cumments-web.js" && exit 1)
          ls dist/assets/pow.worker-*.js > /dev/null || (echo "missing pow.worker" && exit 1)
          echo "artifact verified"
          ls -lh dist/
          sha256sum dist/cumments-web.js | tee dist/cumments-web.js.sha256
          cat dist/cumments-web.js.sha256
      - name: Generate provenance
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          COMMIT=$(git rev-parse HEAD)
          API_CONTRACT=$(grep -E "^commit:" api/openapi.provenance | awk '{print $2}' || echo "unknown")
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > dist/provenance.json <<PROV_EOF
          {
            "name": "cumments-web",
            "version": "$VERSION",
            "tag": "$TAG",
            "commit": "$COMMIT",
            "api_contract": "$API_CONTRACT",
            "built_at": "$BUILT_AT"
          }
          PROV_EOF
          cat dist/provenance.json
      - name: Prepare Pages artifact
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "Preparing site for $TAG ($VERSION)"
          rm -rf site
          mkdir -p site
          # Preserve existing versioned artifacts from gh-pages branch if it exists
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "Fetching existing gh-pages for history preservation..."
            git fetch origin gh-pages --depth=1
            # Check out gh-pages to a temp worktree and copy existing version dirs
            git worktree add /tmp/gh-pages-legacy gh-pages 2>/dev/null || (git fetch origin gh-pages && git worktree add /tmp/gh-pages-legacy origin/gh-pages)
            # Copy all existing 0.* version dirs and latest if present, but exclude the new version/latest which will be overwritten
            for d in /tmp/gh-pages-legacy/0.* /tmp/gh-pages-legacy/latest; do
              if [ -d "$d" ]; then
                base=$(basename "$d")
                if [ "$base" != "$VERSION" ] && [ "$base" != "latest" ]; then
                  echo "Preserving $base"
                  cp -r "$d" site/
                fi
              fi
            done
            # Preserve root index.html if it exists and is not our generated one
            if [ -f /tmp/gh-pages-legacy/index.html ] && [ ! -f site/index.html ]; then
              cp /tmp/gh-pages-legacy/index.html site/index.html.bak || true
            fi
            git worktree remove /tmp/gh-pages-legacy --force
          fi
          # Add new version and latest from single build
          mkdir -p site/$VERSION
          cp -r dist/* site/$VERSION/
          rm -rf site/latest
          mkdir -p site/latest
          cp -r dist/* site/latest/
          # Simple index for browsing
          cat > site/index.html <<SITE_EOF
          <html><body><h1>cumments-web CDN</h1><ul><li><a href="$VERSION/cumments-web.js">$VERSION</a></li><li><a href="latest/cumments-web.js">latest</a></li></ul>
          <p>Provenance: <a href="$VERSION/provenance.json">$VERSION/provenance.json</a> | <a href="latest/provenance.json">latest/provenance.json</a></p></body></html>
          SITE_EOF
          echo "Site content:"
          find site -type f | head -n 50
          ls -lh site/$VERSION/ | head -n 20
          cat site/$VERSION/provenance.json
          echo "latest provenance:"
          cat site/latest/provenance.json
          # Verify worker co-location
          test -f site/$VERSION/assets/pow.worker-*.js 2>/dev/null || (ls site/$VERSION/assets/ && echo "checking worker in $VERSION"; ls site/$VERSION/assets/pow.worker-*.js)
          test -f site/latest/assets/pow.worker-*.js 2>/dev/null || (ls site/latest/assets/ && echo "checking worker in latest"; ls site/latest/assets/pow.worker-*.js)
          echo "Worker co-location verified"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Intentionally no `environment:` here. The `github-pages` environment's
    # branch policy only allows `main`, and GitHub deployment branch policies
    # cannot list tag refs. A `v*` tag is itself the publish gate, so the
    # environment protection is redundant for this workflow.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
