name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Lint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Test
        run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Build
        run: pnpm run build
      - name: Verify build artifacts
        shell: bash
        run: |
          test -f dist/cumments-web.js || { echo "MISSING: dist/cumments-web.js"; exit 1; }
          worker=$(find dist/assets -maxdepth 1 -type f -name 'pow.worker-*.js' -print -quit)
          test -n "$worker" || { echo "MISSING: dist/assets/pow.worker-*.js"; exit 1; }
      - name: Report bundle sizes
        shell: bash
        run: |
          echo "=== Bundle sizes ==="
          ls -lh dist/cumments-web.js | awk '{print "cumments-web.js: " $5}'
          for f in dist/assets/pow.worker-*.js; do
            ls -lh "$f" | awk '{print $NF ": " $5}'
          done

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Generate API types
        run: pnpm run codegen
      - name: Verify generated types are up to date
        run: git diff --exit-code -- src/api/contract/generated.d.ts

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Audit dependencies
        run: pnpm audit

  result:
    name: CI result
    needs: [lint, typecheck, test, build, contract, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail unless all checks succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
