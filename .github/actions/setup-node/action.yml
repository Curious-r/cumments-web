name: "Setup Node and pnpm"
description: "Sets up Node.js 24, pnpm 10.15, and installs dependencies"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
